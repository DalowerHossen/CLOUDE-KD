title = "KD SOLUTION IT gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Documentation, the environment templates and the verification scripts contain no real secrets (the scripts use made-up keys and fixtures)"
paths = [
  '''^\.env\.example$''',
  '''^docs/''',
  '''^package-lock\.json$''',
  '''^scripts/verify/''',
  '''^config/env/[A-Za-z0-9._-]+\.fragment$''',
]
# The navigation files have lines like labelKey: 's09Invoicing.nav.tax'; the word "Key" in the name makes the generic rule take them for keys.
regexes = [
  '''labelKey:\s*'[A-Za-z0-9.]+'''',
]
