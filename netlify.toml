# Netlify build and cache configuration. Secrets are set in the Netlify dashboard, never in this file.
# Set the Functions region to Singapore (ap-southeast-1) in the Netlify site settings.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Build-time only: the application validates its real environment when the server starts.
  SKIP_ENV_VALIDATION = "1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"
