name: security

on:
  pull_request:
  push:
    branches: [integration]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/nextjs --config p/owasp-top-ten --config p/secrets --error --metrics=off

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t kd-solution-it:scan .
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: kd-solution-it:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions
          quiet: true

  dast:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && vars.DAST_TARGET_URL != ''
    steps:
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.DAST_TARGET_URL }}
