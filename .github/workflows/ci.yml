name: ci

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generated files are current
        run: node scripts/gen.mjs --check
      - name: Guards
        run: bash scripts/check-all.sh
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
          APP_ENV: development
      - name: Client bundle secret scan
        run: bash scripts/check-bundle-secrets.sh

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply migrations from zero, re-apply, run assertions
        run: bash scripts/db-apply.sh --clean
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Concurrency and export checks (need the database)
        run: bash scripts/verify-all.sh db

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verification scripts (behaviour of the code, no database)
        run: bash scripts/verify-all.sh app

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the public home page exists (STEP 06)
        id: home
        run: |
          if [ -f "app/(public)/page.tsx" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.home.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.home.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - name: Environment for the test server
        if: steps.home.outputs.present == 'true'
        # The server checks its environment when it starts (SKIP_ENV_VALIDATION only skips the check, not the code that reads the
        # values), so it gets made-up values made fresh on every run. They are not secrets and nothing real is reachable with them.
        run: |
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(openssl rand -hex 30)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(openssl rand -hex 30)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "AUDIT_SIGNING_KEY=$(openssl rand -base64 32)"
            echo "HMAC_TOKEN_SECRET=$(openssl rand -hex 40)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
          } >> "$GITHUB_ENV"
      - if: steps.home.outputs.present == 'true'
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Lighthouse CI (budgets in .lighthouserc.json)
        if: steps.home.outputs.present == 'true'
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
        env:
          SKIP_ENV_VALIDATION: '1'
          APP_ENV: development
