name: ci

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generated files are current
        run: node scripts/gen.mjs --check
      - name: Guards
        run: bash scripts/check-all.sh
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
          APP_ENV: development
      - name: Client bundle secret scan
        run: bash scripts/check-bundle-secrets.sh

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations from zero, re-apply, run assertions
        run: bash scripts/db-apply.sh --clean

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: SKIP_ENV_VALIDATION=1 npm run build
      - name: Lighthouse CI (budgets in .lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
