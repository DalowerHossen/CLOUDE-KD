name: ci

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generated files are current
        run: node scripts/gen.mjs --check
      - name: Guards
        run: bash scripts/check-all.sh
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
          APP_ENV: development
      - name: Client bundle secret scan
        run: bash scripts/check-bundle-secrets.sh

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply migrations from zero, re-apply, run assertions
        run: bash scripts/db-apply.sh --clean

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the public home page exists (STEP 06)
        id: home
        run: |
          if [ -f "app/(public)/page.tsx" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.home.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.home.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.home.outputs.present == 'true'
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Lighthouse CI (budgets in .lighthouserc.json)
        if: steps.home.outputs.present == 'true'
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
        env:
          SKIP_ENV_VALIDATION: '1'
          APP_ENV: development
