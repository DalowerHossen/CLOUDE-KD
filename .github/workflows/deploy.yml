name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: netlify
        type: choice
        options: [netlify, docker]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse Friday deployments after 15:00 UTC
        run: |
          dow="$(date -u +%u)"
          hour="$(date -u +%H)"
          if [ "$dow" = "5" ] && [ "$hour" -ge 15 ]; then
            echo "Deployments are not allowed on Friday after 15:00 UTC." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/integration-check.sh --quick

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy
        run: bash scripts/deploy.sh ${{ inputs.target }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
